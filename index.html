<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Website</title>


  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <header>
    <nav>

      <h2 class="title">Tech<span>Wave</span></h2>

      <div class="hidden" id="mobile-menu">
        <img src="./assets/hamburger-menu.png" alt="">
      </div>

      <!-- Nav items -->
      <ul class="nav-item">
        <li><a href="#">About</a></li>
        <li><a href="#">Episodes</a></li>
        <li><a href="#">Host</a></li>
      </ul>

      <button>
        Subscribe <i class="fa-solid fa-arrow-right-long"></i>
      </button>
    </nav>
  </header>

  <!--  Hero section -->
  <section class="Hero-section">
    <div class="Hero-container">
      <div class="Hero-contant">
        <div class="img-tag">
          <img class="frist-img" src="./assets/hero-circle.png" alt="">
          <img class="secand-img" src="./assets/microphone.png" alt="">
          <div class="new-tag">New</div>
        </div>
        <div class="Hero-descr">
          <h1 class="hero-title">TechWave</h1>
          <p>Your daily dose of tech insights, productivity hacks, and personal growth</p>
          <div class="btn">
            <button class="active-btn"><img src="./assets/spotify.png" alt="">Listen On
              Spotify</button>
            <button id="non-active-btn"><img src="./assets/message.png" alt="">Subscribe</button>
          </div>
        </div>
      </div>
    </div>
  </section>


</body>

</html>
